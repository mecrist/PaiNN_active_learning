CLUSTER:
  type: slurm
  project_name: 'silica_water_mace_run'
  executor: workqueue
  parsl_options:
    nodes_per_block: 1
    init_blocks: 1
    min_blocks: 1
    max_blocks: 4
    label: aimspax_probe_4sys
  slurm_str: |
    #SBATCH --partition=nanotubo
    #SBATCH --ntasks-per-node=32
    #SBATCH --time=8:00:00
  worker_str: |
    module purge
    module use "${AIMS_MODULEFILES:-/home/maria.crist/fhi-aims.260331/modulefiles/}"
    module load fhi-aims/260331

    source /opt/spack/opt/spack/linux-oracle8-x86_64/gcc-12.2.0/miniconda3-22.11.1-qnqpe5kjmlj72r2lv6k4dffgsepien22/etc/profile.d/conda.sh
    conda activate my_env
    
    ulimit -s unlimited
    export KMP_STACKSIZE=512m

    export OMP_NUM_THREADS=1
    export MKL_NUM_THREADS=1
    
    export I_MPI_EXTRA_FILESYSTEM=on
    export I_MPI_EXTRA_FILESYSTEM_FORCE=nfs
    export I_MPI_HYDRA_BOOTSTRAP=slurm
    export I_MPI_PMI_LIBRARY=/usr/lib64/libpmi2.so

    export WORK_QUEUE_DISABLE_SHARED_PORT=1
    
    unset SLURM_MEM_PER_NODE
    
  launch_str: "mpirun -bootstrap slurm aims.x"
  calc_dir: /home/maria.crist/pax/aims_ase_calcs
